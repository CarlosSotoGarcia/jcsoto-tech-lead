# Generado por Loom (ADR-0042) para el Proyecto "PILOTO E1c ITZ Inventarios (Claude cuenta normal CLI)". Sin credenciales:
# la autenticación con GCP la hace google-github-actions/auth.
name: release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/118746543308/locations/global/workloadIdentityPools/loom-github/providers/github
          service_account: loom-release-deployer@itz-inventario.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 release.py
